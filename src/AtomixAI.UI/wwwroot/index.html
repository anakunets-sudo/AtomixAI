<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; connect-src 'self' *;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Wave Terminal</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>

</head>

                                    x2="13.5731%"

                                    <stop offset="0" style="stop-opacity:1; stop-color:#444444" />
                                    <stop offset="0.501961" style="stop-opacity:0.701961; stop-color:#444444" />

                                <linearGradient

                                    y2="102.857%">

                                    <stop offset="0.501961" style="stop-opacity:0.701961; stop-color:#f5f5eb" />

                                <path class="fil1" d="M2.07 0.15c-0.78,0.78 -0.97,-0.06 -1.67,0.2 0.83,-0.81 0.79,0.09 1.67,-0.2z"/>

                    data-tooltip="BIM Wave: Contextual intelligence. Revit execution."
                    data-i18n-tooltip="nav.brand.tooltip">

                </button>                
                <button
                    class="nav-btn"
                    data-tooltip="Train & Tune AI Patterns"
                    data-i18n-tooltip="nav.patternLab.tooltip"
                    data-i18n="nav.patternLab">
                    Pattern Lab

                <button
                    class="nav-btn"
                    data-tooltip="Your pyRevit Scripts Library"
                    data-i18n-tooltip="nav.python.tooltip">
                    <span data-i18n="nav.python">Python scripts</span>
                    <span>
                        <svg

    <div id="chat">
        <div class="msg ai" data-i18n-greeting>Hey! I’m Livvy, your BimWave AI assistant. What are we working on today?</div>
    </div>

    <div id="ai-menu" class="menu-hidden">
        <div id="menu-back-host"></div>
        <div id="menu-search" class="menu-search" hidden>
            <input id="menu-search-input" type="text" placeholder="Search..." data-i18n-placeholder="menu.search.placeholder" autocomplete="off" spellcheck="false" />
            <button type="button" id="menu-search-btn" class="menu-search-btn" aria-label="Search" data-i18n-aria="menu.search" data-tooltip="Search" data-i18n-tooltip="menu.search">&#xE721;</button>
        </div>
        <div id="menu-pinned-action"></div>
        <div id="menu-items"></div>
    </div>

    <div class="input-area">
        <button id="pasteClipboardBtn" class="icon-btn paste-btn" type="button" aria-label="Paste text" data-tooltip="Paste text" data-i18n-tooltip="input.paste" data-i18n-aria="input.paste" hidden>
            <svg aria-hidden="true" viewBox="0 0 11.7 13.5">
                <rect x="2.98" y="0.4" width="3.8" height="2" rx="0.49" ry="0.87"/>
                <rect x="4.42" y="5.09" width="6.88" height="8.01" rx="1.47" ry="1.88"/>
                <path d="M2.98 1.19l-1.17 0c-0.67,0 -0.86,0.09 -1.06,0.3 -0.21,0.21 -0.35,0.46 -0.35,1.13l0 8.26c0,0.67 0.13,0.86 0.34,1.07 0.21,0.21 0.4,0.36 1.07,0.36l1.03 0"/>
                <path d="M6.77 1.19l1.3 0c0.66,0 0.86,0.06 1.07,0.2 0.2,0.14 0.34,0.45 0.34,0.91l0 0.21"/>
            </svg>
        </button>
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open menu" onclick="openMenu()" data-tooltip="Open menu" data-i18n-tooltip="input.menu" data-i18n-aria="input.menu">#</button>
        <div class="ctr-userInput">
            <!--<textarea rows="1" id="userInput" placeholder="Describe sequence... [Enter to send]"></textarea>-->
            <div id="userInput"
                 contenteditable="true"
                 placeholder="Describe sequence... [Enter to send]"
                 data-i18n-placeholder="input.placeholder"></div>

            <button id="micBtn" class="icon-btn" aria-label="Voice" onclick="toggleVoice()" data-tooltip="Voice input" data-i18n-tooltip="input.voice" data-i18n-aria="input.voice">
                <span id="micIcon"></span>
            </button>
            <button id="sendBtn" class="icon-btn send-btn" aria-label="Send" onclick="sendMessage()" data-tooltip="Send" data-i18n-tooltip="input.send" data-i18n-aria="input.send">
                <span style="font-size: 16px; margin: 0 0 0 -3px; transform: scaleY(1.1);"></span>
            </button>
        </div>
    </div>

    <div class="footer">
        <div>
            <button data-tooltip="Expand environment settings" data-i18n-tooltip="footer.settings" style="background: none; border: none; padding: 0px 20px; margin-left:-20px; cursor: pointer; height: 27px; overflow: hidden;">
                <p style="font-family: 'Segoe MDL2 Assets'; font-size: 16px; color: #888; padding: 0px; margin-top: 8px;"></p>
            </button>
        </div>
        <div class="status-group">
            <span class="status-dot online"></span>
            <span style="padding: 0 0 2px; color: var(--nav-text);">
                <span data-i18n="footer.aiCore">AI core:</span> <span class="model-link status-text" data-i18n="footer.modelName">Google Gemini</span>
            </span>
        </div>
        <div class="theme-switch-wrapper">
            <span style="font-family: 'Segoe MDL2 Assets'; font-size: 12px;"></span>
            <label class="switch">
                <input type="checkbox" id="themeToggle" onclick="toggleTheme()">
                <span class="slider"></span>
            </label>
            <span style="font-family: 'Segoe MDL2 Assets'; font-size: 12px;"></span>
        </div>
    </div>

    <script>
        // Инициализация темы при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            const initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(initialTheme);
        });

        function toggleTheme() {
            const toggle = document.getElementById('themeToggle');
            const nextTheme = toggle.checked ? 'dark' : 'light';
            applyTheme(nextTheme);
            // Используем единый метод из bridge.js вместо старого sendAction
            window.Atomix.RevitBridge.send('theme_manual', { theme: nextTheme });
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const toggle = document.getElementById('themeToggle');
            if (toggle) toggle.checked = (theme === 'dark');
        }
    </script>




    <script>window.Atomix && window.Atomix.I18n && window.Atomix.I18n.apply();</script>

    <script src="js/purify.min.js"></script>
    <script src="js/main.js"></script>

    <!-- 1. Сначала загружаем "библиотеки" и контроллеры -->
    <script src="js/bridge.js"></script>
    <script src="js/chips.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/editor.js"></script>

    <!-- 2. Последним загружаем главный файл, который их использует -->
    <script src="js/app.js"></script>

</body>
</html>
